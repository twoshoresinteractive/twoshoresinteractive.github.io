<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 18">
  <title>Shore gull</title>
  <!-- Original silhouette drawn for Two Shores Interactive. -->
  <style>
    .near-wing, .far-wing { transform-origin: 16px 10px; }
    @media (prefers-reduced-motion: no-preference) {
      .near-wing { animation: flap .8s ease-in-out infinite; }
      .far-wing { animation: flap .8s ease-in-out -.2s infinite reverse; }
    }
    @keyframes flap {
      0%, 100% { transform: scaleY(.98); }
      45% { transform: scaleY(-.45); }
      70% { transform: scaleY(.55); }
    }
  </style>
  <g fill="#202724">
    <path class="far-wing" d="M16 9C13 8 10 4 1 4c6 2 9 7 14 8l3-1Z"/>
    <path d="M10 12l3-2 5-1 4 1 2 1-4 1-4 1-3-1-4 1Z"/>
    <path class="near-wing" d="M15 10c3-4 9-8 16-8-5 2-8 6-11 9-2 2-4 2-5-1Z"/>
  </g>
</svg>
